<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV Online PRO</title>
    
    <!-- Video.js y CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { 
            background-color: #0b0b0b; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .container { text-align: center; width: 90%; max-width: 400px; }
        h1 { margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 20px; }
        .btn-popup {
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-telefe { background: linear-gradient(45deg, #28a745, #20c997); color: white; }
        .btn-america { background: linear-gradient(45deg, #e61d2b, #ff4757); color: white; }
        .btn-popup:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* MODAL */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: #000;
        }
        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .close-bar {
            background: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .close-btn { color: #ff4757; cursor: pointer; font-weight: bold; font-size: 14px; }

        /* CONTENEDORES */
        #video-wrapper, #iframe-wrapper { flex-grow: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
        
        /* Ajuste especial Telefe */
        #iframeContainer {
            position: absolute;
            top: -245px; left: -2%; width: 104%; height: 1200px; border: none;
        }
        @media (max-width: 600px) { #iframeContainer { top: -135px; width: 110%; left: -5%; } }

        /* Estilo Botón Cast de VideoJS */
        .vjs-chromecast-button .vjs-icon-placeholder:before {
            content: "\f10b"; /* Icono de cast nativo de VideoJS */
            font-family: VideoJS;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MI TV ONLINE</h1>
        <div class="btn-group">
            <button class="btn-popup btn-telefe" onclick="abrirTelefe('https://rosario.mitelefe.com/telefe-rosario-en-vivo')">
                🔵 Telefe Rosario
            </button>

            <button class="btn-popup btn-america" onclick="abrirAmérica('https://dai.google.com/linear/hls/pa/event/OY2i_lL4SMyXE5Zaj4ULEg/stream/a4d5ebec-a11d-44ce-88ec-c3836742210e:SCL2/master.m3u8')">
                🔴 América TV + CAST
            </button>
        </div>
    </div>

    <!-- El Modal Único -->
    <div id="miModal" class="modal">
        <div class="modal-content">
            <div class="close-bar">
                <span id="titulo-modal">Reproduciendo...</span>
                <span class="close-btn" onclick="cerrarTodo()">✕ CERRAR REPRODUCTOR</span>
            </div>
            
            <!-- Contenedor para América -->
            <div id="video-wrapper" style="display:none;"></div>
            
            <!-- Contenedor para Telefe -->
            <div id="iframe-wrapper" style="display:none;">
                <iframe id="iframeContainer" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- SCRIPTS DE VIDEOJS + CHROMECAST -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <!-- Script oficial de Google Cast -->
    <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <!-- Plugin VideoJS Chromecast -->
    <script src="https://cdn.jsdelivr.net/npm/@silvermine/videojs-chromecast@1.2.1/dist/silvermine-videojs-chromecast.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@silvermine/videojs-chromecast@1.2.1/dist/silvermine-videojs-chromecast.css" rel="stylesheet">

    <script>
        var player;
        const modal = document.getElementById('miModal');
        const vWrapper = document.getElementById('video-wrapper');
        const iWrapper = document.getElementById('iframe-wrapper');
        const iframe = document.getElementById('iframeContainer');
        const titulo = document.getElementById('titulo-modal');

        function abrirAmérica(url) {
            titulo.innerText = "América TV (En Vivo)";
            modal.style.display = "block";
            vWrapper.style.display = "block";
            iWrapper.style.display = "none";

            // Limpiar previo
            if (player) player.dispose();
            vWrapper.innerHTML = `<video id="video_player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay style="width:100%;height:100%;"></video>`;

            // Inicializar VideoJS con soporte Chromecast
            player = videojs('video_player', {
                techOrder: ["html5"],
                plugins: {
                    chromecast: {
                        addButtonToControlBar: true,
                        requestSessionTimeout: 10000
                    }
                }
            });

            player.src({ src: url, type: 'application/x-mpegURL' });
            
            player.ready(function() {
                player.play().catch(e => console.log("Auto-play prevenido, requiere clic"));
            });
        }

        function abrirTelefe(url) {
            titulo.innerText = "Telefe Rosario (En Vivo)";
            modal.style.display = "block";
            vWrapper.style.display = "none";
            iWrapper.style.display = "block";
            
            if (player) { player.dispose(); player = null; }
            iframe.src = url;
        }

        function cerrarTodo() {
            modal.style.display = "none";
            iframe.src = "";
            if (player) {
                player.dispose();
                player = null;
            }
        }

        // Cerrar si tocan fuera (opcional)
        window.onclick = function(event) {
            if (event.target == modal) cerrarTodo();
        }
    </script>
</body>
</html>
