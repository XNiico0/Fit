<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV Online</title>

    <!-- Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <!-- HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Chromecast -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <style>

        body {
            background: #0f0f0f;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial;
            color: white;
        }

        .container {
            text-align: center;
        }

        .btn-group {

            display: flex;
            flex-direction: column;

            gap: 15px;
            margin-top: 20px;
        }

        .btn-popup {

            border: none;
            border-radius: 8px;

            padding: 15px 30px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            color: white;

            min-width: 260px;

            transition: .3s;
        }

        .btn-popup:hover {

            transform: scale(1.03);
            opacity: .9;
        }

        .btn-telefe {
            background: #28a745;
        }

        .btn-america {
            background: #e53935;
        }

        .btn-discovery {
            background: #ff9800;
        }

        .btn-tn {
            background: #1976d2;
        }

        .modal {

            display: none;

            position: fixed;

            z-index: 999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,.95);
        }

        .modal-content {

            position: relative;

            margin: auto;

            top: 50%;

            transform: translateY(-50%);

            width: 95%;
            max-width: 900px;

            aspect-ratio: 16/9;
        }

        #player {

            width: 100%;
            height: 100%;

            background: #000;

            border-radius: 12px;
            overflow: hidden;
        }

        #hlsContainer {

            width: 100%;
            height: 100%;

            background: #000;

            border-radius: 12px;
            overflow: hidden;

            display: none;
        }

        #hlsVideo {

            width: 100%;
            height: 100%;
        }

        .iframe-wrapper {

            width: 100%;
            height: 100%;

            overflow: hidden;

            position: relative;

            border-radius: 12px;

            background: #000;
        }

        #iframeContainer.full-view {

            position: absolute;

            top: -245px;
            left: -2%;

            width: 104%;
            height: 1000px;

            border: none;
        }

        @media (max-width: 600px) {

            #iframeContainer.full-view {

                top: -135px;

                width: 110%;

                left: -5%;
            }
        }

        .close {

            position: absolute;

            top: -40px;
            right: 0;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            z-index: 1001;
        }

        google-cast-launcher {

            position: absolute;

            top: 12px;
            right: 55px;

            width: 28px;
            height: 28px;

            z-index: 9999;
        }

    </style>

</head>
<body>

<div class="container">

<h1>Mi TV Online</h1>

<div class="btn-group">

    <!-- Telefe -->
    <button class="btn-popup btn-telefe"
    onclick="abrirWeb(
    'https://rosario.mitelefe.com/telefe-rosario-en-vivo'
    )">

        🔵 VER TELEFE ROSARIO

    </button>

    <!-- Discovery -->
    <button class="btn-popup btn-discovery"
    onclick="cargarCanal('discovery')">

        🟠 VER DISCOVERY H&H

    </button>

    <!-- América -->
    <button class="btn-popup btn-america"
    onclick="cargarCanal('america')">

        🔴 VER AMÉRICA TV

    </button>

    <!-- TN -->
    <button class="btn-popup btn-tn"
    onclick="cargarCanalHLS('tn')">

        🔵 VER TN EN VIVO

    </button>

</div>

</div>

<div id="miModal" class="modal">

<div class="modal-content">

    <span class="close"
    onclick="cerrarPopUp()">

        ✕ CERRAR

    </span>

    <google-cast-launcher>
    </google-cast-launcher>

    <!-- Clappr -->
    <div id="player"
    style="display:none;">
    </div>

    <!-- HLS -->
    <div id="hlsContainer">

        <video
        id="hlsVideo"
        controls
        autoplay
        muted
        playsinline>
        </video>

    </div>

    <!-- Iframe -->
    <div id="wrapperTelefe"
    class="iframe-wrapper"
    style="display:none;">

        <iframe id="iframeContainer"
        class="full-view"
        frameborder="0"
        allowfullscreen>
        </iframe>

    </div>

</div>

</div>

<script>

    let player;
    let hls;
    let currentStream = "";

    const modal =
        document.getElementById('miModal');

    const playerDiv =
        document.getElementById('player');

    const iframe =
        document.getElementById('iframeContainer');

    const wrapper =
        document.getElementById('wrapperTelefe');

    const hlsContainer =
        document.getElementById('hlsContainer');

    const hlsVideo =
        document.getElementById('hlsVideo');

    // Chromecast

    window['__onGCastApiAvailable'] =
    function(isAvailable) {

        if (isAvailable) {

            cast.framework
            .CastContext
            .getInstance()
            .setOptions({

                receiverApplicationId:
                chrome.cast.media
                .DEFAULT_MEDIA_RECEIVER_APP_ID,

                autoJoinPolicy:
                chrome.cast
                .AutoJoinPolicy
                .ORIGIN_SCOPED
            });
        }
    };

    // Cargar canal JSON (Clappr)

    async function cargarCanal(nombre) {

        try {

            const response =
            await fetch("./canales.json");

            const canales =
            await response.json();

            const url =
            canales[nombre];

            if (!url) {

                alert(
                "Canal no encontrado"
                );

                return;
            }

            abrirStream(url);

        } catch(err) {

            console.log(err);

            alert(
            "Error cargando canales"
            );
        }
    }

    // Cargar canal HLS

    async function cargarCanalHLS(nombre) {

        try {

            const response =
            await fetch("./canales.json");

            const canales =
            await response.json();

            const url =
            canales[nombre];

            if (!url) {

                alert(
                "Canal no encontrado"
                );

                return;
            }

            abrirHLS(url);

        } catch(err) {

            console.log(err);

            alert(
            "Error cargando canales"
            );
        }
    }

    // Abrir stream Clappr

    function abrirStream(url) {

        limpiarReproductores();

        currentStream = url;

        modal.style.display =
        "block";

        playerDiv.style.display =
        "block";

        wrapper.style.display =
        "none";

        hlsContainer.style.display =
        "none";

        iframe.src = "";

        player = new Clappr.Player({

            source: url,

            parentId: "#player",

            width: "100%",
            height: "100%",

            autoPlay: true
        });
    }

    // Abrir HLS

    function abrirHLS(url) {

        limpiarReproductores();

        currentStream = url;

        modal.style.display =
        "block";

        playerDiv.style.display =
        "none";

        wrapper.style.display =
        "none";

        hlsContainer.style.display =
        "block";

        hlsVideo.muted = true;
        hlsVideo.autoplay = true;
        hlsVideo.controls = true;

        if (Hls.isSupported()) {

            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });

            hls.loadSource(url);

            hls.attachMedia(hlsVideo);

            hls.on(Hls.Events.MEDIA_ATTACHED, function () {

                console.log("Media attached");

            });

            hls.on(Hls.Events.MANIFEST_PARSED, function () {

                console.log("Manifest cargado");

                hlsVideo.play()
                .then(() => {

                    console.log("Reproduciendo");

                })
                .catch(err => {

                    console.log(err);

                });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {

                console.log("HLS ERROR:", data);

                if (data.fatal) {

                    switch(data.type) {

                        case Hls.ErrorTypes.NETWORK_ERROR:

                            console.log("Error de red");

                            hls.startLoad();

                            break;

                        case Hls.ErrorTypes.MEDIA_ERROR:

                            console.log("Error media");

                            hls.recoverMediaError();

                            break;

                        default:

                            hls.destroy();

                            break;
                    }
                }
            });

        } else if (
            hlsVideo.canPlayType(
            'application/vnd.apple.mpegurl'
            )
        ) {

            hlsVideo.src = url;

            hlsVideo.addEventListener(
            'loadedmetadata',
            function() {

                hlsVideo.play();

            });
        }
    }

    // Abrir web

    function abrirWeb(url) {

        limpiarReproductores();

        modal.style.display =
        "block";

        playerDiv.style.display =
        "none";

        wrapper.style.display =
        "block";

        hlsContainer.style.display =
        "none";

        iframe.src = url;
    }

    // Limpiar reproductores

    function limpiarReproductores() {

        iframe.src = "";

        if (player) {

            player.destroy();
            player = null;
        }

        if (hls) {

            hls.destroy();
            hls = null;
        }

        hlsVideo.pause();
        hlsVideo.src = "";
    }

    // Cerrar popup

    function cerrarPopUp() {

        modal.style.display =
        "none";

        limpiarReproductores();
    }

    // Click afuera

    window.onclick =
    function(event) {

        if (
            event.target == modal
        ) {

            cerrarPopUp();
        }
    };

</script>

</body>
</html>
