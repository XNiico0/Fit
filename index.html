<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor TV</title>

    <!-- Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <!-- Chromecast SDK -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <style>
        body {
            background-color: #0f0f0f;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .container {
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-popup {
            background: #008cff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            min-width: 250px;
        }

        .btn-telefe {
            background: #28a745;
        }

        .btn-discovery {
            background: #ff9800;
        }

        .btn-popup:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
        }

        .modal-content {
            position: relative;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            width: 95%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
        }

        #player {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            border-radius: 12px;
            background: #000;
        }

        #iframeContainer.full-view {
            position: absolute;
            top: -245px;
            left: -2%;
            width: 104%;
            height: 1000px;
            border: none;
        }

        @media (max-width: 600px) {
            #iframeContainer.full-view {
                top: -135px;
                width: 110%;
                left: -5%;
            }
        }

        .close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
        }

        /* Chromecast */
        google-cast-launcher {
            position: absolute;
            top: 12px;
            right: 55px;
            width: 28px;
            height: 28px;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Mi TV Online</h1>

    <div class="btn-group">

        <!-- Telefe -->
        <button class="btn-popup btn-telefe"
            onclick="abrirWeb('https://rosario.mitelefe.com/telefe-rosario-en-vivo')">
            🔵 VER TELEFE ROSARIO
        </button>

        <!-- Discovery H&H -->
        <button class="btn-popup btn-discovery"
            onclick="abrirWeb('https://www.tvporinternet2.com/discovery-hyh-en-vivo-por-internet.html')">
            🟠 VER DISCOVERY H&H
        </button>

        <!-- América TV -->
        <button class="btn-popup"
            onclick="abrirStream('https://dai.google.com/linear/hls/pa/event/OY2i_lL4SMyXE5Zaj4ULEg/stream/c5e68933-5fcf-4056-8dfa-4ea0fa6ab6f4:SCL2/master.m3u8')">
            🔴 VER AMÉRICA TV
        </button>

    </div>

</div>

<div id="miModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="cerrarPopUp()">✕ CERRAR</span>

        <!-- Chromecast -->
        <google-cast-launcher></google-cast-launcher>

        <!-- Player -->
        <div id="player" style="display:none;"></div>

        <!-- Iframe -->
        <div id="wrapperTelefe"
             class="iframe-wrapper"
             style="display:none;">

            <iframe id="iframeContainer"
                    class="full-view"
                    frameborder="0"
                    allowfullscreen>
            </iframe>

        </div>

    </div>

</div>

<script>

    let player;
    let currentStream = "";

    const modal = document.getElementById('miModal');
    const playerDiv = document.getElementById('player');
    const iframe = document.getElementById('iframeContainer');
    const wrapper = document.getElementById('wrapperTelefe');

    // Chromecast
    window['__onGCastApiAvailable'] = function(isAvailable) {

        if (isAvailable) {

            cast.framework.CastContext.getInstance().setOptions({
                receiverApplicationId:
                    chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,

                autoJoinPolicy:
                    chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });

            console.log("Chromecast listo");
        }
    };

    // Streams m3u8
    function abrirStream(url) {

        currentStream = url;

        modal.style.display = "block";

        playerDiv.style.display = "block";
        wrapper.style.display = "none";

        iframe.src = "";

        if (player) {
            player.destroy();
        }

        player = new Clappr.Player({
            source: url,
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: true
        });

        const context = cast.framework.CastContext.getInstance();

        context.addEventListener(
            cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
            function(event) {

                if (
                    event.sessionState ===
                    cast.framework.SessionState.SESSION_STARTED
                ) {

                    enviarAlChromecast();
                }
            }
        );
    }

    // Chromecast
    async function enviarAlChromecast() {

        try {

            const context =
                cast.framework.CastContext.getInstance();

            const session =
                context.getCurrentSession();

            const mediaInfo =
                new chrome.cast.media.MediaInfo(
                    currentStream,
                    'application/vnd.apple.mpegurl'
                );

            mediaInfo.streamType =
                chrome.cast.media.StreamType.LIVE;

            mediaInfo.metadata =
                new chrome.cast.media.GenericMediaMetadata();

            mediaInfo.metadata.title = "TV Online";

            const request =
                new chrome.cast.media.LoadRequest(mediaInfo);

            await session.loadMedia(request);

            // Pausar celular
            if (player && player.core) {
                player.pause();
            }

            console.log("Transmitiendo");

        } catch (err) {

            console.log("Error Cast:", err);
        }
    }

    // Web iframe
    function abrirWeb(url) {

        modal.style.display = "block";

        playerDiv.style.display = "none";
        wrapper.style.display = "block";

        if (player) {
            player.destroy();
        }

        iframe.src = url;
    }

    // Cerrar
    function cerrarPopUp() {

        modal.style.display = "none";

        iframe.src = "";

        if (player) {
            player.destroy();
        }
    }

    // Click afuera
    window.onclick = function(event) {

        if (event.target == modal) {
            cerrarPopUp();
        }
    };

</script>

</body>
</html>
