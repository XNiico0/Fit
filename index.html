<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV Online</title>

    <!-- Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <!-- HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Chromecast -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <style>

        body {
            background: #0f0f0f;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial;
            color: white;
        }

        .container {
            text-align: center;
        }

        .btn-group {

            display: flex;
            flex-direction: column;

            gap: 15px;
            margin-top: 20px;
        }

        .btn-popup {

            border: none;
            border-radius: 8px;

            padding: 15px 30px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            color: white;

            min-width: 260px;

            transition: .3s;
        }

        .btn-popup:hover {

            transform: scale(1.03);
            opacity: .9;
        }

        .btn-telefe {
            background: #28a745;
        }

        .btn-america {
            background: #e53935;
        }

        .btn-tn {
            background: #1976d2;
        }

        .modal {

            display: none;

            position: fixed;

            z-index: 999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,.95);
        }

        .modal-content {

            position: relative;

            margin: auto;

            top: 50%;

            transform: translateY(-50%);

            width: 95%;
            max-width: 900px;

            aspect-ratio: 16/9;
        }

        #player {

            width: 100%;
            height: 100%;

            background: #000;

            border-radius: 12px;
            overflow: hidden;
        }

        #hlsContainer {

            width: 100%;
            height: 100%;

            background: #000;

            border-radius: 12px;
            overflow: hidden;

            display: none;
        }

        #hlsVideo {

            width: 100%;
            height: 100%;
        }

        .iframe-wrapper {

            width: 100%;
            height: 100%;

            overflow: hidden;

            position: relative;

            border-radius: 12px;

            background: #000;
        }

        #iframeContainer.full-view {

            position: absolute;

            top: -245px;
            left: -2%;

            width: 104%;
            height: 1000px;

            border: none;
        }

        @media (max-width: 600px) {

            #iframeContainer.full-view {

                top: -135px;

                width: 110%;

                left: -5%;
            }
        }

        .close {

            position: absolute;

            top: -40px;
            right: 0;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            z-index: 1001;
        }

        google-cast-launcher {

            position: absolute;

            top: 12px;
            right: 55px;

            width: 28px;
            height: 28px;

            z-index: 9999;
        }

    </style>

</head>
<body>

<div class="container">

<h1>Mi TV Online</h1>

<div class="btn-group">

    <!-- Telefe -->
    <button class="btn-popup btn-telefe"
    onclick="abrirWeb(
    'https://rosario.mitelefe.com/telefe-rosario-en-vivo'
    )">

        🔵 VER TELEFE ROSARIO

    </button>

    <!-- América -->
    <button class="btn-popup btn-america"
    onclick="cargarCanal('america')">

        🔴 VER AMÉRICA TV

    </button>

    <!-- TN -->
    <button class="btn-popup btn-tn"
    onclick="cargarCanalHLS('tn')">

        🔵 VER TN EN VIVO

    </button>

</div>

</div>

<div id="miModal" class="modal">

<div class="modal-content">

    <span class="close"
    onclick="cerrarPopUp()">

        ✕ CERRAR

    </span>

    <!-- Chromecast -->
    <google-cast-launcher>
    </google-cast-launcher>

    <!-- Clappr -->
    <div id="player"
    style="display:none;">
    </div>

    <!-- HLS -->
    <div id="hlsContainer">

        <video
        id="hlsVideo"
        controls
        autoplay
        muted
        playsinline>
        </video>

    </div>

    <!-- Telefe iframe -->
    <div id="wrapperTelefe"
    class="iframe-wrapper"
    style="display:none;">

        <iframe id="iframeContainer"
        class="full-view"
        frameborder="0"
        allowfullscreen>
        </iframe>

    </div>

</div>

</div>

<script>

    let player;
    let hls;
    let currentStream = "";

    // JSON implementado

    const canales = {

        america:
        "https://dai.google.com/linear/hls/pa/event/OY2i_lL4SMyXE5Zaj4ULEg/stream/e2d5f1bb-87c9-420b-85a3-4c8e5ef040aa:SCL2/variant/085a2414a253631c90e7ac89ccc9f934/bandwidth/1031000.m3u8",

        tn:
        "https://live-01-01-tn.vodgc.net/TN24/index.m3u8"
    };

    const modal =
        document.getElementById('miModal');

    const playerDiv =
        document.getElementById('player');

    const hlsContainer =
        document.getElementById('hlsContainer');

    const hlsVideo =
        document.getElementById('hlsVideo');

    const wrapper =
        document.getElementById('wrapperTelefe');

    const iframe =
        document.getElementById('iframeContainer');

    // Chromecast setup

    window['__onGCastApiAvailable'] =
    function(isAvailable) {

        if (isAvailable) {

            cast.framework
            .CastContext
            .getInstance()
            .setOptions({

                receiverApplicationId:
                chrome.cast.media
                .DEFAULT_MEDIA_RECEIVER_APP_ID,

                autoJoinPolicy:
                chrome.cast
                .AutoJoinPolicy
                .ORIGIN_SCOPED
            });
        }
    };

    // América con Clappr

    function cargarCanal(nombre) {

        const url = canales[nombre];

        if (!url) {

            alert("Canal no encontrado");
            return;
        }

        abrirStream(url);
    }

    // TN con HLS

    function cargarCanalHLS(nombre) {

        const url = canales[nombre];

        if (!url) {

            alert("Canal no encontrado");
            return;
        }

        abrirHLS(url);
    }

    // Abrir América

    function abrirStream(url) {

        limpiarReproductores();

        currentStream = url;

        modal.style.display =
        "block";

        playerDiv.style.display =
        "block";

        hlsContainer.style.display =
        "none";

        wrapper.style.display =
        "none";

        player = new Clappr.Player({

            source: url,

            parentId: "#player",

            width: "100%",
            height: "100%",

            autoPlay: true
        });

        escucharChromecast();
    }

    // Abrir TN

    function abrirHLS(url) {

        limpiarReproductores();

        currentStream = url;

        modal.style.display =
        "block";

        playerDiv.style.display =
        "none";

        hlsContainer.style.display =
        "block";

        wrapper.style.display =
        "none";

        hlsVideo.muted = true;
        hlsVideo.autoplay = true;

        if (Hls.isSupported()) {

            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });

            hls.loadSource(url);

            hls.attachMedia(hlsVideo);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {

                hlsVideo.play()
                .catch(err => {

                    console.log(err);
                });
            });

        } else if (
            hlsVideo.canPlayType(
            'application/vnd.apple.mpegurl'
            )
        ) {

            hlsVideo.src = url;

            hlsVideo.addEventListener(
            'loadedmetadata',
            function() {

                hlsVideo.play();
            });
        }

        escucharChromecast();
    }

    // Escuchar Chromecast

    function escucharChromecast() {

        const context =
        cast.framework
        .CastContext
        .getInstance();

        context.addEventListener(

            cast.framework
            .CastContextEventType
            .SESSION_STATE_CHANGED,

            function(event) {

                if (

                    event.sessionState ===

                    cast.framework
                    .SessionState
                    .SESSION_STARTED

                ) {

                    enviarAlChromecast();
                }
            }
        );
    }

    // Enviar stream al Chromecast

    async function enviarAlChromecast() {

        try {

            const context =

            cast.framework
            .CastContext
            .getInstance();

            const session =

            context
            .getCurrentSession();

            const mediaInfo =

            new chrome.cast
            .media.MediaInfo(

                currentStream,

                'application/vnd.apple.mpegurl'
            );

            mediaInfo.streamType =

            chrome.cast
            .media.StreamType.LIVE;

            mediaInfo.metadata =

            new chrome.cast
            .media.GenericMediaMetadata();

            mediaInfo.metadata.title =
            "TV Online";

            const request =

            new chrome.cast
            .media.LoadRequest(
                mediaInfo
            );

            await session
            .loadMedia(request);

            if (
                player &&
                player.core
            ) {

                player.pause();
            }

            if (hlsVideo) {

                hlsVideo.pause();
            }

        } catch(err) {

            console.log(err);
        }
    }

    // Abrir Telefe

    function abrirWeb(url) {

        limpiarReproductores();

        modal.style.display =
        "block";

        playerDiv.style.display =
        "none";

        hlsContainer.style.display =
        "none";

        wrapper.style.display =
        "block";

        iframe.src = url;
    }

    // Limpiar

    function limpiarReproductores() {

        iframe.src = "";

        if (player) {

            player.destroy();
            player = null;
        }

        if (hls) {

            hls.destroy();
            hls = null;
        }

        hlsVideo.pause();
        hlsVideo.src = "";
    }

    // Cerrar

    function cerrarPopUp() {

        modal.style.display =
        "none";

        limpiarReproductores();
    }

    // Click afuera

    window.onclick =
    function(event) {

        if (
            event.target == modal
        ) {

            cerrarPopUp();
        }
    };

</script>

</body>
</html>
