<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV Online</title>
    
    <!-- Scripts de Clappr y Plugins -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-chromecast-plugin@latest/dist/clappr-chromecast-plugin.min.js"></script>
    
    <style>
        body { 
            background-color: #0f0f0f; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            height: 100vh; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            color: white;
        }
        #player { 
            width: 100%; 
            max-width: 850px; 
            aspect-ratio: 16 / 9; 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .menu-canales {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }
        .btn-canal {
            background: #1e1e1e;
            color: #efefef;
            border: 1px solid #333;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-canal:hover {
            background: #2a2a2a;
            border-color: #008cff;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <div class="menu-canales">
        <button class="btn-canal" onclick="cambiarCanal('https://telefecanal1.akamaized.net/hls/live/2033413-b/canal5rosario/TOK/master.m3u8?hdnea=st=1778732808~exp=1778740008~acl=/hls/live/2033413-b/canal5rosario/TOK/*~hmac=7f634d5df47d29586f121f5b0f5e4613d440c5d09cda4a40e4a7a674adcc9f5d', 'Telefe Rosario')">
            Telefe Rosario
        </button>

        <button class="btn-canal" onclick="cambiarCanal('https://dai.google.com/linear/hls/pa/event/OY2i_lL4SMyXE5Zaj4ULEg/stream/a4d5ebec-a11d-44ce-88ec-c3836742210e:SCL2/master.m3u8', 'Canal Nuevo')">
            America Tv
        </button>
    </div>

    <script>
        // Inicializamos el reproductor
        var player = new Clappr.Player({
            source: "https://telefecanal1.akamaized.net/hls/live/2033413-b/canal5rosario/TOK/master.m3u8?hdnea=st=1778732808~exp=1778740008~acl=/hls/live/2033413-b/canal5rosario/TOK/*~hmac=7f634d5df47d29586f121f5b0f5e4613d440c5d09cda4a40e4a7a674adcc9f5d",
            parentId: "#player",
            width: '100%',
            height: '100%',
            autoPlay: false,
            plugins: [ChromecastPlugin],
            chromecast: {
                appId: '9DFB77C0',
                media: {
                    title: '',
                    subtitle: 'Streaming'
                }
            },
            playback: {
                hlsjsConfig: {
                    // Esto ayuda a que los links con tokens de Akamai carguen mejor
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                }
            }
        });

        function cambiarCanal(url, nombre) {
            player.load(url);
            player.play();
            // Actualiza la info del Chromecast
            player.configure({
                chromecast: {
                    media: { title: nombre }
                }
            });
        }
    </script>
</body>
</html>
