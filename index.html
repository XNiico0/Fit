<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor TV</title>
    
    <!-- Cargamos Clappr y el soporte para HLS (m3u8) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-hlsjs-playback@latest/dist/clappr-hlsjs-playback.min.js"></script>
    
    <style>
        body { 
            background-color: #0f0f0f; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            font-family: 'Segoe UI', sans-serif; 
            color: white;
        }

        .container { text-align: center; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-popup {
            background: #008cff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            min-width: 250px;
            text-transform: uppercase;
        }

        /* Colores personalizados por canal */
        .btn-telefe { background: #28a745; } 
        .btn-america { background: #e61d2b; }

        .btn-popup:hover { transform: scale(1.05); filter: brightness(1.2); }

        .modal {
            display: none; 
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
        }

        .modal-content {
            position: relative;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            width: 95%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
        }

        #player { 
            width: 100%; 
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            border-radius: 12px;
            background: #000;
        }

        #iframeContainer.full-view {
            position: absolute;
            top: -245px; 
            left: -2%;
            width: 104%; 
            height: 1000px; 
            border: none;
        }

        @media (max-width: 600px) {
            #iframeContainer.full-view {
                top: -135px; 
                width: 110%;
                left: -5%;
            }
        }

        .close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mi TV Online</h1>
        
        <div class="btn-group">
            <button class="btn-popup btn-telefe" onclick="abrirWeb('https://rosario.mitelefe.com/telefe-rosario-en-vivo')">
                🔵 Telefe Rosario
            </button>

            <!-- Botón de América TV actualizado -->
            <button class="btn-popup btn-america" onclick="abrirStream('https://dai.google.com/linear/hls/pa/event/OY2i_lL4SMyXE5Zaj4ULEg/stream/a4d5ebec-a11d-44ce-88ec-c3836742210e:SCL2/master.m3u8')">
                🔴 América TV
            </button>
        </div>
    </div>

    <div id="miModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarPopUp()">✕ CERRAR REPRODUCTOR</span>
            
            <div id="player" style="display:none;"></div>
            
            <div id="wrapperTelefe" class="iframe-wrapper" style="display:none;">
                <iframe id="iframeContainer" class="full-view" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        var player;
        var modal = document.getElementById('miModal');
        var playerDiv = document.getElementById('player');
        var iframe = document.getElementById('iframeContainer');
        var wrapper = document.getElementById('wrapperTelefe');

        function abrirStream(url) {
            modal.style.display = "block";
            playerDiv.style.display = "block";
            wrapper.style.display = "none";
            iframe.src = ""; 

            if (player) player.destroy();

            // Configuración optimizada de Clappr
            player = new Clappr.Player({
                source: url,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true,
                mute: false,
                preload: 'auto',
                playback: {
                    hlsjsConfig: {
                        enableWorker: true
                    }
                }
            });
        }

        function abrirWeb(url) {
            modal.style.display = "block";
            playerDiv.style.display = "none";
            wrapper.style.display = "block";
            
            if (player) player.destroy();
            
            iframe.src = url; 
        }

        function cerrarPopUp() {
            modal.style.display = "none";
            iframe.src = ""; 
            if (player) player.destroy();
        }

        // Cerrar al hacer clic fuera del video
        window.onclick = function(event) {
            if (event.target == modal) cerrarPopUp();
        }
    </script>
</body>
</html>
