<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV Online + Cast</title>
    
    <!-- Librerías para el Reproductor con Transmisión (Cast) -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@silvermine/videojs-chromecast@1.2.1/dist/silvermine-videojs-chromecast.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@silvermine/videojs-chromecast@1.2.1/dist/silvermine-videojs-chromecast.css" rel="stylesheet">

    <style>
        body { 
            background-color: #0f0f0f; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            font-family: 'Segoe UI', sans-serif; 
            color: white;
        }

        .container { text-align: center; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-popup {
            background: #008cff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            min-width: 250px;
        }

        .btn-telefe { background: #28a745; } 
        .btn-america { background: #e61d2b; }

        .btn-popup:hover { transform: scale(1.03); opacity: 0.9; }

        .modal {
            display: none; 
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
        }

        .modal-content {
            position: relative;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            width: 95%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Estilo para el reproductor de América */
        #player-container { width: 100%; height: 100%; display: none; }

        /* Estilo para el iframe de Telefe */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            display: none;
        }

        #iframeContainer.full-view {
            position: absolute;
            top: -245px; 
            left: -2%;
            width: 104%; 
            height: 1000px; 
            border: none;
        }

        @media (max-width: 600px) {
            #iframeContainer.full-view { top: -135px; width: 110%; left: -5%; }
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mi TV Online</h1>
        
        <div class="btn-group">
            <!-- BOTÓN TELEFE -->
            <button class="btn-popup btn-telefe" onclick="abrirWeb('https://rosario.mitelefe.com/telefe-rosario-en-vivo')">
                🔵 VER TELEFE ROSARIO
            </button>

            <!-- BOTÓN AMÉRICA -->
            <button class="btn-popup btn-america" onclick="abrirStream('https://dai.google.com/linear/hls/pa/event/OY2i_lL4SMyXE5Zaj4ULEg/stream/a4d5ebec-a11d-44ce-88ec-c3836742210e:SCL2/master.m3u8')">
                🔴 VER AMÉRICA (CON CAST)
            </button>
        </div>
    </div>

    <div id="miModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarPopUp()">✕ CERRAR</span>
            
            <!-- Contenedor para América -->
            <div id="player-container"></div>
            
            <!-- Contenedor para Telefe -->
            <div id="wrapperTelefe" class="iframe-wrapper">
                <iframe id="iframeContainer" class="full-view" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        var player;
        var modal = document.getElementById('miModal');
        var playerContainer = document.getElementById('player-container');
        var iframe = document.getElementById('iframeContainer');
        var wrapper = document.getElementById('wrapperTelefe');

        // FUNCIÓN PARA AMÉRICA (Usa VideoJS para poder transmitir)
        function abrirStream(url) {
            modal.style.display = "block";
            playerContainer.style.display = "block";
            wrapper.style.display = "none";
            
            // Limpiar si ya había un reproductor
            if (player) { player.dispose(); }

            playerContainer.innerHTML = `<video id="video_vjs" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay style="width:100%;height:100%;"></video>`;

            player = videojs('video_vjs', {
                techOrder: ["html5"],
                plugins: {
                    chromecast: { addButtonToControlBar: true }
                },
                sources: [{ src: url, type: 'application/x-mpegURL' }]
            });
        }

        // FUNCIÓN PARA TELEFE (Usa el iframe original)
        function abrirWeb(url) {
            modal.style.display = "block";
            playerContainer.style.display = "none";
            wrapper.style.display = "block";
            
            if (player) { player.dispose(); player = null; }
            
            iframe.src = url; 
        }

        function cerrarPopUp() {
            modal.style.display = "none";
            iframe.src = ""; 
            if (player) { player.dispose(); player = null; }
        }

        window.onclick = function(event) {
            if (event.target == modal) cerrarPopUp();
        }
    </script>
</body>
</html>
