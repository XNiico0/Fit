<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Mi TV Online</title>

<!-- Clappr -->
<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Chromecast -->
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0b0b;
    color:white;
    font-family:Arial, Helvetica, sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.container{

    width:100%;
    max-width:500px;
}

.title{

    text-align:center;
    margin-bottom:25px;

    font-size:32px;
    font-weight:700;
}

.btn-group{

    display:flex;
    flex-direction:column;
    gap:15px;
}

.channel-btn{

    border:none;
    border-radius:14px;

    padding:18px;

    font-size:17px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    transition:.25s;

    width:100%;
}

.channel-btn:hover{

    transform:scale(1.02);
    opacity:.95;
}

.channel-btn:active{

    transform:scale(.98);
}

.telefe{
    background:#1e88e5;
}

.discovery{
    background:#fb8c00;
}

.america{
    background:#e53935;
}

.tn{
    background:#1565c0;
}

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.96);

    z-index:9999;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;
}

.modal.active{

    display:flex;
}

.modal-content{

    position:relative;

    width:100%;
    max-width:1200px;

    aspect-ratio:16/9;

    background:black;

    border-radius:16px;

    overflow:hidden;
}

#player{

    width:100%;
    height:100%;
}

#hlsContainer{

    width:100%;
    height:100%;

    display:none;
}

#hlsVideo{

    width:100%;
    height:100%;

    background:black;
}

#iframeWrapper{

    width:100%;
    height:100%;

    display:none;

    overflow:hidden;

    position:relative;
}

#iframePlayer{

    position:absolute;

    border:none;

    width:100%;
    height:100%;
}

.close-btn{

    position:absolute;

    top:12px;
    right:12px;

    z-index:99999;

    background:rgba(0,0,0,.7);

    border:none;

    color:white;

    width:42px;
    height:42px;

    border-radius:50%;

    font-size:20px;

    cursor:pointer;
}

.close-btn:hover{

    background:rgba(255,255,255,.15);
}

google-cast-launcher{

    position:absolute;

    top:14px;
    right:62px;

    z-index:99999;

    width:28px;
    height:28px;
}

.loader{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:black;

    z-index:100;
}

.loader.active{

    display:flex;
}

.spinner{

    width:60px;
    height:60px;

    border:5px solid rgba(255,255,255,.15);
    border-top-color:white;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

.error-box{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    background:black;

    z-index:150;
}

.error-box.active{

    display:flex;
}

.error-content{

    max-width:400px;
}

.error-content h2{

    margin-bottom:10px;
}

.retry-btn{

    margin-top:20px;

    border:none;

    padding:12px 20px;

    border-radius:10px;

    background:#1976d2;

    color:white;

    cursor:pointer;

    font-weight:bold;
}

@media(max-width:700px){

    .title{
        font-size:26px;
    }

    .channel-btn{

        padding:16px;
        font-size:15px;
    }

    .modal-content{

        aspect-ratio:auto;
        height:70vh;
    }
}

</style>

</head>
<body>

<div class="container">

    <h1 class="title">
        📺 Mi TV Online
    </h1>

    <div class="btn-group">

        <button
        class="channel-btn telefe"
        onclick="abrirWeb('https://rosario.mitelefe.com/telefe-rosario-en-vivo')">

            🔵 VER TELEFE ROSARIO

        </button>

        <button
        class="channel-btn discovery"
        onclick="cargarCanal('discovery')">

            🟠 VER DISCOVERY H&H

        </button>

        <button
        class="channel-btn america"
        onclick="cargarCanal('america')">

            🔴 VER AMÉRICA TV

        </button>

        <button
        class="channel-btn tn"
        onclick="cargarCanalHLS('tn')">

            🔵 VER TN EN VIVO

        </button>

    </div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <button
        class="close-btn"
        onclick="cerrarPlayer()">

            ✕

        </button>

        <google-cast-launcher>
        </google-cast-launcher>

        <!-- LOADER -->

        <div class="loader" id="loader">

            <div class="spinner"></div>

        </div>

        <!-- ERROR -->

        <div class="error-box" id="errorBox">

            <div class="error-content">

                <h2>
                    Error al cargar el canal
                </h2>

                <p id="errorText">
                    No se pudo reproducir.
                </p>

                <button
                class="retry-btn"
                onclick="reintentarCanal()">

                    Reintentar

                </button>

            </div>

        </div>

        <!-- CLAPPR -->

        <div id="player"></div>

        <!-- HLS -->

        <div id="hlsContainer">

            <video
            id="hlsVideo"
            controls
            autoplay
            playsinline
            muted>
            </video>

        </div>

        <!-- IFRAME -->

        <div id="iframeWrapper">

            <iframe
            id="iframePlayer"
            allowfullscreen>
            </iframe>

        </div>

    </div>

</div>

<script>

let player = null;
let hls = null;

let ultimoMetodo = null;
let ultimoCanal = null;

const modal =
document.getElementById("modal");

const playerDiv =
document.getElementById("player");

const hlsContainer =
document.getElementById("hlsContainer");

const hlsVideo =
document.getElementById("hlsVideo");

const iframeWrapper =
document.getElementById("iframeWrapper");

const iframePlayer =
document.getElementById("iframePlayer");

const loader =
document.getElementById("loader");

const errorBox =
document.getElementById("errorBox");

const errorText =
document.getElementById("errorText");

function mostrarLoader(){

    loader.classList.add("active");
}

function ocultarLoader(){

    loader.classList.remove("active");
}

function mostrarError(msg){

    errorText.innerText = msg;

    errorBox.classList.add("active");

    ocultarLoader();
}

function ocultarError(){

    errorBox.classList.remove("active");
}

function abrirModal(){

    modal.classList.add("active");
}

function cerrarPlayer(){

    modal.classList.remove("active");

    limpiarTodo();
}

function limpiarTodo(){

    ocultarLoader();
    ocultarError();

    iframePlayer.src = "";

    iframeWrapper.style.display = "none";

    hlsContainer.style.display = "none";

    playerDiv.style.display = "none";

    if(player){

        player.destroy();
        player = null;
    }

    if(hls){

        hls.destroy();
        hls = null;
    }

    hlsVideo.pause();

    hlsVideo.removeAttribute("src");

    hlsVideo.load();
}

window.onclick = function(e){

    if(e.target === modal){

        cerrarPlayer();
    }
};

document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        cerrarPlayer();
    }
});

async function obtenerCanales(){

    const response =
    await fetch("./canales.json?t=" + Date.now());

    if(!response.ok){

        throw new Error("No se pudo leer canales.json");
    }

    return await response.json();
}

async function cargarCanal(nombre){

    ultimoMetodo = "clappr";
    ultimoCanal = nombre;

    try{

        mostrarLoader();

        const canales =
        await obtenerCanales();

        const url =
        canales[nombre];

        if(!url){

            throw new Error(
            "Canal no encontrado"
            );
        }

        abrirStream(url);

    }catch(err){

        console.error(err);

        mostrarError(
        err.message
        );
    }
}

async function cargarCanalHLS(nombre){

    ultimoMetodo = "hls";
    ultimoCanal = nombre;

    try{

        mostrarLoader();

        const canales =
        await obtenerCanales();

        const url =
        canales[nombre];

        if(!url){

            throw new Error(
            "Canal no encontrado"
            );
        }

        abrirHLS(url);

    }catch(err){

        console.error(err);

        mostrarError(
        err.message
        );
    }
}

function abrirStream(url){

    limpiarTodo();

    abrirModal();

    mostrarLoader();

    playerDiv.style.display = "block";

    player = new Clappr.Player({

        source:url,

        parentId:"#player",

        width:"100%",
        height:"100%",

        autoPlay:true,

        mute:false,

        mediacontrol:{
            seekbar:"#1976d2",
            buttons:"#ffffff"
        }
    });

    player.on(
    Clappr.Events.PLAYER_READY,
    function(){

        ocultarLoader();
    });

    player.on(
    Clappr.Events.PLAYER_ERROR,
    function(){

        mostrarError(
        "El stream no pudo reproducirse."
        );
    });
}

function abrirHLS(url){

    limpiarTodo();

    abrirModal();

    mostrarLoader();

    hlsContainer.style.display = "block";

    if(Hls.isSupported()){

        hls = new Hls({

            enableWorker:true,

            lowLatencyMode:true,

            backBufferLength:90
        });

        hls.loadSource(url);

        hls.attachMedia(hlsVideo);

        hls.on(
        Hls.Events.MANIFEST_PARSED,
        function(){

            hlsVideo.play()
            .then(() => {

                ocultarLoader();

            })
            .catch(err => {

                console.log(err);

                ocultarLoader();
            });
        });

        hls.on(
        Hls.Events.ERROR,
        function(event, data){

            console.error(data);

            if(data.fatal){

                switch(data.type){

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        hls.startLoad();

                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:

                        hls.recoverMediaError();

                        break;

                    default:

                        mostrarError(
                        "Error fatal HLS."
                        );

                        hls.destroy();

                        break;
                }
            }
        });

    }else if(
        hlsVideo.canPlayType(
        "application/vnd.apple.mpegurl"
        )
    ){

        hlsVideo.src = url;

        hlsVideo.addEventListener(
        "loadedmetadata",
        function(){

            hlsVideo.play();

            ocultarLoader();
        });

    }else{

        mostrarError(
        "Tu navegador no soporta HLS."
        );
    }
}

function abrirWeb(url){

    limpiarTodo();

    abrirModal();

    mostrarLoader();

    iframeWrapper.style.display = "block";

    iframePlayer.src = url;

    iframePlayer.onload = function(){

        ocultarLoader();
    };
}

function reintentarCanal(){

    ocultarError();

    if(
        ultimoMetodo === "clappr"
    ){

        cargarCanal(
        ultimoCanal
        );

    }else if(
        ultimoMetodo === "hls"
    ){

        cargarCanalHLS(
        ultimoCanal
        );
    }
}

window['__onGCastApiAvailable'] =
function(isAvailable){

    if(isAvailable){

        cast.framework
        .CastContext
        .getInstance()
        .setOptions({

            receiverApplicationId:
            chrome.cast.media
            .DEFAULT_MEDIA_RECEIVER_APP_ID,

            autoJoinPolicy:
            chrome.cast
            .AutoJoinPolicy
            .ORIGIN_SCOPED
        });
    }
};

</script>

</body>
</html>
